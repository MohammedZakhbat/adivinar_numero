<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Adivinar número</title>
</head>
<body class="bg-slate-400 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 space-y-6">
        <h1 class="text-center text-2xl font-bold text-slate-800 mb-6">Frio / Tibio / Caliente</h1>

        <form onsubmit=""  class="space-y-4 mt-4">
            <label for="" class="block text-center text-slate-700 font-medium">Escribe un número entre 1 y 500:</label>
            <input class="w-full text-center border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" id="numInput" type="number" min="1" max="500" required>
            <button type="submit"  class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition"> ❓Adivinar  </button>
        </form>
        <p id="resultado" class="text-center mt-6 text-lg font-semibold text-slate-800"></p>
    </div>
    <script src="./app.js"></script>
</body>
</html>
